namespace: mysql

serviceAccount:
  name: mysql-sa

replicaCount: 2

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

secrets:
  MYSQL_ROOT_PASSWORD: "replace-root-password"
  MYSQL_DATABASE: "app_db"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "replace-me"

persistence:
  storage: 1Gi

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  enabled: true
  key: app
  values:
    - mysql

tolerations:
  - key: app
    operator: Equal
    value: mysql
    effect: NoSchedule
