apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "todoapp.fullname" . }}-secrets-reader
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "todoapp.fullname" . }}-secrets-reader
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "todoapp.fullname" . }}-secrets-reader
